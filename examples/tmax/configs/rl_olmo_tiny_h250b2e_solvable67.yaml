# Signs of life on the 67 tasks the labeling pilot saw h250-b2e solve (11.8% success on that pool), with no other
# tasks: the reward on this pool should rise if RL works at all. The validated smoke layout (2 trainer GPUs, EP 2, + 2
# SGLang engines), 8 tasks x 16 samples per step (~8.4 steps per pass over the pool), 60 steps (~7 passes), shuffled.
# Otherwise as rl_olmo_tiny_h250b2e_curriculum.yaml: sync GRPO with DPPO-TV at lr 1e-6, radix cache, decode graphs,
# 64K/16K budget, 30 min episode timeout, checkpoints every 10 steps.
exp_name: tmax_rl_olmo_tiny_h250b2e_solvable67
model_name: olmo35-tiny-h250-b2e
prompt_file: /weka/oe-adapt-default/shashankg/miles_tmax/datasets/tmax-15k-open-instruct/miles_prompts_olmo_h250b2e_solvable67.jsonl
sglang_radix_cache: true
sglang_max_running_requests: 64
sglang_max_mamba_cache_size: 384
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_gpus_per_node: 4
train_gpus: 2
rollout_gpus: 2
expert_parallel_size: 2
rollout_batch_size: 8
n_samples_per_prompt: 16
num_rollout: 60
max_seq_len: 65536
rollout_max_response_len: 16384
episode_timeout_s: 1800
lr: 1.0e-6
filter_zero_std: false
save_interval: 10
data_dir: /weka/oe-adapt-default/shashankg/miles_tmax/datasets
output_dir: /weka/oe-adapt-default/allennlp/deletable_checkpoint_states/shashankg/miles
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles

beaker:
  launcher: examples/tmax/run_tmax_olmo.py
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  min_runtime: 8h
  retries: 10
  gpus: 4
  shared_memory: 256GiB
  image: beaker:shashankg/miles-olmo-bfb2f1bf7a
  weka: [nora-default, oe-adapt-default, olmo-3p5-post-checkpoints]
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 32
