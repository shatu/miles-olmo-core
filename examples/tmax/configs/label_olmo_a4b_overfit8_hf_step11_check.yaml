# Checks that an HF snapshot exported by the OLMo-core trainer (--save-hf) serves as the trained policy: rollout-only
# on the 8 overfit tasks, from the step-12 export (rollout 11) of the async A4B overfit tmax_rl_olmo_a4b_h259_overfit8_async_64k_ep8_20261124_014138, written after
# that run resumed from its step-10 native checkpoint (01M85Y84RF). Its training rollouts scored 0.86-0.93 by steps
# 10-15, against 0.56-0.62 for the base checkpoint, so a correct export should score near 0.9 here, a broken one near
# the base or worse. Same sampling as training: 32 samples per task.
exp_name: tmax_label_olmo_a4b_overfit8_hf_step11_check
hf_path: /weka/oe-adapt-default/allennlp/deletable_checkpoint_states/shashankg/miles/tmax_rl_olmo_a4b_h259_overfit8_async_64k_ep8_20261124_014138/checkpoints/hf/step_11
model_name: olmo35-tiny-h250-b2e                 # the Olmo 3.5 family name; hf_path picks the checkpoint
rollout_only: true
prompt_file: /weka/oe-adapt-default/shashankg/miles_tmax/datasets/tmax-15k-open-instruct/miles_prompts_olmo_h250b2e_overfit8.jsonl
asynchronous: true
sglang_radix_cache: true
sglang_max_running_requests: 32                # A4B on one B300 per engine: 144 GB of weights, 140 MiB of KDA state per sequence
sglang_mem_fraction_static: 0.85
sglang_max_mamba_cache_size: 192
rollout_routing_replay: false                 # nothing trains on the routing
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_gpus_per_node: 8
train_gpus: 2                                 # ignored: rollout_only serves on all rollout_gpus
rollout_gpus: 8
expert_parallel_size: 2
rollout_batch_size: 8
n_samples_per_prompt: 32
num_rollout: 1
max_seq_len: 65536
rollout_max_response_len: 16384
episode_timeout_s: 1800                       # as the training run
filter_zero_std: false
save_interval: 1000
data_dir: /weka/oe-adapt-default/shashankg/miles_tmax/datasets
output_dir: /weka/oe-adapt-default/allennlp/deletable_checkpoint_states/shashankg/miles
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles

beaker:
  launcher: examples/tmax/run_tmax_olmo.py
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  min_runtime: 1h
  retries: 1
  gpus: 8
  shared_memory: 512GiB
  image: beaker:shashankg/miles-olmo-bfb2f1bf7a
  weka: [nora-default, oe-adapt-default, olmo-3p5-post-checkpoints]
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 64
