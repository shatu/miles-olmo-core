# TMax async GRPO on Olmo 3.5 Tiny h250-b2e, solved-first curriculum. Built from prod_4node_gateway_moe_35b_timeout600.yaml
# (the TMax prod recipe): its rollout, sandbox, checkpoint, timeout and W&B settings are kept as they are. Changed for the
# Olmo checkpoint and the one-node OLMo-core layout only:
#   - launcher/model/image: run_tmax_olmo.py, olmo35-tiny-h250-b2e, beaker:shashankg/miles-olmo-bfb2f1bf7a (weka adds the
#     olmo-3p5-post-checkpoints bucket);
#   - layout: one node, 4 trainer GPUs (OLMo-core EP 4) + 4 SGLang engines, asynchronous (prod: async_rollout_gpus on its
#     own nodes); the Megatron-only keys (TP/CP/EP, max_tokens_per_gpu, optimizer_cpu_offload, model_dir) and HF snapshots
#     (OLMo-core writes native checkpoints only) are dropped; --log-probs-backend is not a flag of this Miles;
#   - context: max_seq_len 65536, the model's limit (prod 67584); 30 min episode timeout;
#   - data: the curriculum prompt file in order (rollout_shuffle off), 16 tasks x 16 samples per step (prod 8 x 32), 75
#     steps; filter_zero_std off as in the curriculum runs so far (prod: on);
#   - SGLang: upstream's namespaced radix cache with KDA state (extra_buffer, 384 slots > 5 x 64 running requests);
#   - Beaker: ai2/olmo-instruct with its group's budget ai2/oe-other; 8 h min runtime (prod: none).
exp_name: tmax_rl_olmo_tiny_h250b2e_curriculum_async_radix_prod
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
model_name: olmo35-tiny-h250-b2e
prompt_file: /weka/oe-adapt-default/shashankg/miles_tmax/datasets/tmax-15k-open-instruct/miles_prompts_olmo_h250b2e_curriculum.jsonl
rollout_shuffle: false
num_gpus_per_node: 8
train_gpus: 4
rollout_gpus: 4
expert_parallel_size: 4
asynchronous: true
rollout_batch_size: 16
n_samples_per_prompt: 16
num_rollout: 75
max_seq_len: 65536
rollout_max_response_len: 16384               # --per_turn_max_tokens 16384
max_steps: 64                                 # --max_steps 64
episode_timeout_s: 1800
filter_zero_std: false
max_weight_staleness: 4                       # groups older than --async_steps 4 are dropped
async_max_concurrent_samples: 512             # --pool_size 512: 2 batches in flight
async_data_buffer_capacity_factor: 4          # --async_steps 4: generation runs at most 4 steps ahead
sglang_mem_fraction_static: 0.8
sglang_radix_cache: true                      # partitioned per rollout call (upstream namespaced cache)
sglang_max_running_requests: 64
sglang_max_mamba_cache_size: 384
sandbox_start_concurrency: 64                 # concurrent container starts on the fleet, rollout-wide
start_failure: drop                           # a container the fleet cannot start drops its group (prod_4node_gateway)
lr: 1.0e-6
save_interval: 5                              # --checkpoint_state_freq 5
extra_args: "--distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800"
data_dir: /weka/oe-adapt-default/shashankg/miles_tmax/datasets
output_dir: /weka/oe-adapt-default/allennlp/deletable_checkpoint_states/shashankg/miles
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true                      # --save_traces + --save_trainer_logprobs: each step's batch, tokens on
wandb_project: oe-general-agents
wandb_entity: ai2-llm

beaker:
  launcher: examples/tmax/run_tmax_olmo.py
  cluster: ai2/holmes
  workspace: ai2/olmo-instruct
  budget: ai2/oe-other                        # ai2/olmo-instruct is in the ai2/oe-scaling group, whose budget this is
  priority: urgent
  min_runtime: 8h
  retries: 10                                 # a retry resumes from exp_name's checkpoint
  gpus: 8
  shared_memory: 512GiB
  image: beaker:shashankg/miles-olmo-bfb2f1bf7a
  weka: [nora-default, oe-adapt-default, olmo-3p5-post-checkpoints]
  dockerhub_username: shashankg209
  # The fleet's head registry: the head starts a gateway from it and waits for enough replicas (512 sandboxes / 8 each).
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 64
  keep_last_n_checkpoints: 2                  # 140 GB each with Adam state
  env:
    MILES_SESSION_REQUEST_TIMEOUT_S: 600       # collect samples: wait up to 10 min instead of 2
    NCCL_DEBUG: WARN                          # mason's default is ERROR, which hides why a collective stalls
