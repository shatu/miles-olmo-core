# smoke_olmo_tiny_sync_imgbfb2f1bf7a.yaml on the OLMo team's math/science RL checkpoint of Olmo 3.5 Tiny
# (olmo35-tiny-h235-rl100: H235 B2048-Noff-LR6e6, final export after update 100) instead of the s-c-noag SFT.
# Otherwise identical.
# TMax on Olmo 3.5 Tiny with the OLMo-core trainer (run_tmax_olmo.py), synchronous: one Holmes node, 2 trainer GPUs
# (expert parallel 2) and 2 SGLang GPUs, sandboxes on the jupiter128 podman fleet. Checks the pipeline end to end
# (standalone OLMo-core loader, olmo35 TITO, XML tool calls, DPPO-TV, R3), not learning.
exp_name: tmax_smoke_olmo_tiny_h235rl_sync
model_name: olmo35-tiny-h235-rl100
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_gpus_per_node: 4
train_gpus: 2
rollout_gpus: 2
expert_parallel_size: 2
num_prompts: 64
rollout_batch_size: 4
n_samples_per_prompt: 4
num_rollout: 3
max_seq_len: 32768
rollout_max_response_len: 8192
filter_zero_std: false
save_interval: 1000
episode_timeout_s: 3600
data_dir: /weka/oe-adapt-default/shashankg/miles_tmax/datasets
output_dir: /weka/oe-adapt-default/allennlp/deletable_checkpoint_states/shashankg/miles
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true

beaker:
  launcher: examples/tmax/run_tmax_olmo.py
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  min_runtime: 8h
  retries: 0
  gpus: 4
  shared_memory: 256GiB
  image: beaker:shashankg/miles-olmo-bfb2f1bf7a
  weka: [nora-default, oe-adapt-default, olmo-3p5-post-checkpoints]
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 8
