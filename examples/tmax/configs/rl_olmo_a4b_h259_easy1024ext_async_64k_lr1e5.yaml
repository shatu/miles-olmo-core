# First serious Terminal-RL run for the Olmo 3.5 A4B checkpoint (ledger H259): the TMax prod recipe (async, active
# sampling, 8 prompts x 32 samples, 4 steps of staleness, 512 samples in flight as prod_4node_gateway.yaml) at lr 1e-5,
# the rate that worked for Tiny (held-out pass@1 0 -> 4.2%), at the recipe's 64K context.
# Qualified by the async 8-task overfit 01M85KEEWA (same trainer: 8 GPUs, EP8, 64K rows): reward 0.62 -> 0.87 in 10
# steps, trainer memory flat at 181.6 GiB allocated / ~250 GiB reserved, weight pushes after every step.
# Layout: rollout-bound there (training ~2 of ~9 minutes per step with 8 engines), so 1 trainer node + 3 engine nodes.
# Data (miles_prompts_olmo_a4b_easy1024_ext2048.jsonl, in order): the 1,024 shortest tasks with a Qwen TMax prior >= 0.3,
# then the next 2,048 shortest with a prior >= 0.5 (shuffled within blocks of 128), none of the labeling pilot's 1,000,
# which stay held out (A4B baseline there: pass@1 14.2%, pass@8 43.9%). On the pilot, A4B's success rose with the Qwen
# prior and fell with prompt length: short tasks with a prior >= 0.5 had pass@1 ~24%, 65% of them solved sometimes.
# Checkpoints and HF snapshots (pass@k on the pilot) every 20 steps.
exp_name: tmax_rl_olmo_a4b_h259_easy1024ext_async_64k_lr1e5
hf_path: /weka/nora-default/shashankg/checkpoints/olmo35-a4b/h259-a4b-c12r-ota-s34521-hf_step7888-eosfix
num_nodes: 4
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
model_name: olmo35-tiny-h250-b2e
prompt_file: /weka/oe-adapt-default/shashankg/miles_tmax/datasets/tmax-15k-open-instruct/miles_prompts_olmo_a4b_easy1024_ext2048.jsonl
rollout_shuffle: false                        # the file's order: easy1024 first, then longer tasks
num_gpus_per_node: 8
train_gpus: 8                                 # node 1: the trainer, EP8
rollout_gpus: 24                              # nodes 2-4: 24 one-GPU engines
expert_parallel_size: 8
asynchronous: true
rollout_batch_size: 8                         # --num_unique_prompts_rollout 8
n_samples_per_prompt: 32                      # --num_samples_per_prompt_rollout 32
num_rollout: 200
max_seq_len: 65536                            # the TMax recipe's context; trained fine on EP8 in 01M85KEEWA
rollout_max_response_len: 16384               # --per_turn_max_tokens 16384
max_steps: 64                                 # --max_steps 64
episode_timeout_s: 1800
filter_zero_std: true                         # --active_sampling
max_weight_staleness: 4                       # groups older than --async_steps 4 are dropped
async_max_concurrent_samples: 512             # prod_4node_gateway's --pool_size 512: 2 batches in flight
async_data_buffer_capacity_factor: 4          # --async_steps 4: generation runs at most 4 steps ahead
sglang_mem_fraction_static: 0.85
sglang_radix_cache: true                      # partitioned per rollout call (upstream namespaced cache)
sglang_max_running_requests: 32                # A4B on one B300: 144 GB of weights, 140 MiB of KDA state per sequence
sglang_max_mamba_cache_size: 192
sandbox_start_concurrency: 64                 # concurrent container starts on the fleet, rollout-wide
start_failure: drop                           # a container the fleet cannot start drops its group (prod_4node_gateway)
lr: 1.0e-5
save_interval: 20                             # about 1 TB per native checkpoint with Adam state
hf_snapshot_every: 20                         # HF exports (145 GB) for pass@k evaluation on the pilot's 1,000 tasks
extra_args: "--distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800 --log-probs-chunk-size 1024 --train-env-vars '{\"PYTORCH_CUDA_ALLOC_CONF\":\"expandable_segments:True\"}'"
data_dir: /weka/oe-adapt-default/shashankg/miles_tmax/datasets
output_dir: /weka/oe-adapt-default/allennlp/deletable_checkpoint_states/shashankg/miles
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true                      # --save_traces + --save_trainer_logprobs: each step's batch, tokens on
wandb_project: oe-general-agents
wandb_entity: ai2-llm

beaker:
  launcher: examples/tmax/run_tmax_olmo.py
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  min_runtime: 8h
  retries: 10                                 # a retry resumes from exp_name's checkpoint
  nodes: 4
  gpus: 8
  shared_memory: 512GiB
  image: beaker:shashankg/miles-olmo-bfb2f1bf7a
  weka: [nora-default, oe-adapt-default, olmo-3p5-post-checkpoints]
  dockerhub_username: shashankg209
  # The fleet's head registry: the head starts a gateway from it and waits for enough replicas (512 sandboxes / 8 each).
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 64
  keep_last_n_checkpoints: 1                  # about 1 TB each with Adam state
  env:
    MILES_SESSION_REQUEST_TIMEOUT_S: 600       # collect samples: wait up to 10 min instead of 2
    RAY_HEAD_WAIT_S: 1800                     # the Olmo head is up within minutes; a stale leader fails fast
    NCCL_DEBUG: WARN                          # mason's default is ERROR, which hides why a collective stalls
    NCCL_CUMEM_ENABLE: "1"                     # as open-instruct's MILES launcher: trainer and engines
    NCCL_NVLS_ENABLE: "0"                      # as SGLang's engine default there; Miles' Ray backend would set 1
    OI_MILES_PUBLICATION_DIAGNOSTICS: "1"     # per-rank export/bucket progress markers, in case a push stalls
