# A4B (ledger H259) on SWE repair tasks: rollout-only labels for 1,024 random tasks of the validated R2E-Gym-Subset
# (shatu/miles shashank/tmax-swe: tools/convert_r2e_gym.py + validate_swe_tasks.py; 4,456 tasks from 10 Python
# repositories, none in SWE-bench Verified), 8 samples each. Finds the tasks A4B solves sometimes (an easy set to
# train on) before an R2E training run. As the Qwen R2E runs: each task's environment/setup.sh prepares its
# container, and a submit runs the repository's tests (tool_call_timeout_s 600). Our own copy of the dataset
# directory (symlinks to the parquet and tarball, extracted here), so jobs never extract into the original.
exp_name: tmax_label_olmo_a4b_h259_r2e1024
hf_path: /weka/nora-default/shashankg/checkpoints/olmo35-a4b/h259-a4b-c12r-ota-s34521-hf_step7888-eosfix
model_name: olmo35-tiny-h250-b2e                 # the Olmo 3.5 family name; hf_path picks the checkpoint
rollout_only: true
skip_labeled: true
dataset: /weka/oe-adapt-default/shashankg/miles_tmax/datasets/r2e-gym-subset-tmax-validated
prompt_file: /weka/oe-adapt-default/shashankg/miles_tmax/datasets/r2e-gym-subset-tmax-validated/miles_prompts_label1024.jsonl
asynchronous: true
sglang_radix_cache: true
sglang_max_running_requests: 32                # A4B on one B300 per engine: 144 GB of weights, 140 MiB of KDA state per sequence
sglang_mem_fraction_static: 0.85
sglang_max_mamba_cache_size: 192               # > 5 x 32 running requests (radix cache)
rollout_routing_replay: false                 # nothing trains on the routing
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_gpus_per_node: 8
train_gpus: 2                                 # ignored: rollout_only serves on all rollout_gpus
rollout_gpus: 8
expert_parallel_size: 2
rollout_batch_size: 32
n_samples_per_prompt: 8
max_seq_len: 65536
rollout_max_response_len: 16384
episode_timeout_s: 7200
tool_call_timeout_s: 600                      # a submit runs the repository's tests
filter_zero_std: false
save_interval: 1000
data_dir: /weka/oe-adapt-default/shashankg/miles_tmax/datasets
output_dir: /weka/oe-adapt-default/allennlp/deletable_checkpoint_states/shashankg/miles
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles

beaker:
  launcher: examples/tmax/run_tmax_olmo.py
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  min_runtime: "0s"                           # backfill on free B300s; preemption resumes from the traces
  retries: 10
  gpus: 8
  shared_memory: 512GiB
  image: beaker:shashankg/miles-olmo-bfb2f1bf7a
  weka: [nora-default, oe-adapt-default, olmo-3p5-post-checkpoints]
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 64
